{% extends "base.html" %}

{% block title %}{{ status_code }} · TheWhaleFiles{% endblock %}

{% block head_extra %}<meta name="robots" content="noindex, nofollow" />{% endblock %}

{% block nav_action %}
<a class="btn btn--soft btn--sm" href="/?lang={{ lang }}">{{ t.nav_back_index }}</a>
{% endblock %}

{% block body %}
<section class="band band--light">
  <div class="inner">
    <div class="band-head band-head--center error-page">
      <p class="eyebrow">{{ status_code }}</p>
      <h2>{{ message }}</h2>
      <p>
        <a class="btn btn--primary" href="/?lang={{ lang }}">{{ t.error_home }}</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
