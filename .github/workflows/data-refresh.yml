name: Refresco de datos

# En Vercel no hay proceso que sobreviva a la respuesta, así que el polling
# está apagado allí: sin esto, los datos se quedarían congelados en la fecha del
# último comando lanzado a mano desde un portátil.
on:
  schedule:
    # Cada seis horas. Las fuentes oficiales publican por lotes; bajar de aquí
    # sólo gasta ancho de banda, porque la latencia real la marca cuándo publica
    # la fuente, no cada cuánto preguntamos.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      repair_dates:
        # Para bases creadas antes de separar la fecha de publicación de la de
        # operación: borra lo importado y lo relee de las fuentes. Tarda, y
        # sólo hace falta una vez por base.
        description: "Reparar fechas (borra y reingiere Congreso y SEC)"
        type: boolean
        default: false

concurrency:
  # Dos pasadas a la vez sobre la misma base se pisarían al deduplicar.
  group: data-refresh
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ENABLE_POLLING: "0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar la conexión con la base
        # Falla aquí, diciendo qué revisar, en vez de a mitad de la ingesta con
        # un traceback de SQLAlchemy. Describe la forma del secreto sin
        # enseñarlo: GitHub sólo oculta el valor entero, no sus trozos.
        run: |
          python - <<'EOF'
          import os
          import sys

          from sqlalchemy.engine import make_url
          from sqlalchemy.exc import ArgumentError

          raw = os.environ.get("DATABASE_URL", "")
          if not raw.strip():
              sys.exit("El secreto DATABASE_URL está vacío o no existe en el repositorio.")

          try:
              from app.database import DATABASE_URL, engine
          except ArgumentError as error:
              hints = []
              if "://" not in raw:
                  hints.append(
                      "no contiene '://': no es una URL (¿sólo la contraseña, o una "
                      "cadena 'host=… dbname=…'?)"
                  )
              else:
                  scheme = raw.strip().split("://", 1)[0].strip("'\" ")
                  if scheme.isalpha() and len(scheme) <= 20:
                      hints.append(f"empieza por el esquema '{scheme}'")
                  else:
                      hints.append("lleva algo delante del esquema postgresql://")
              if any(char.isspace() for char in raw.strip()):
                  hints.append("contiene espacios o saltos de línea por medio")
              if "@" not in raw:
                  hints.append("no contiene '@' entre usuario y host")
              elif raw.count("@") > 1:
                  hints.append(
                      "tiene más de una '@': si la contraseña lleva @, #, / o :, "
                      "hay que codificarla (%40, %23, %2F, %3A)"
                  )
              sys.exit(
                  f"DATABASE_URL no es una URL válida ({type(error).__name__}). "
                  f"Pistas: {'; '.join(hints) or 'ninguna'}. "
                  "Debe ser sólo la URL: postgresql://usuario:clave@host/base?sslmode=require"
              )

          if not DATABASE_URL.startswith("postgresql"):
              sys.exit("DATABASE_URL no apunta a Postgres (postgresql://…).")
          make_url(DATABASE_URL)
          from sqlalchemy import text

          with engine.connect() as connection:
              connection.execute(text("SELECT 1"))
          print("Conexión con la base: ok")
          EOF

      - name: Reparar fechas
        if: ${{ inputs.repair_dates }}
        run: python -m scripts.repair_dates

      - name: Nuevas operaciones del Congreso
        run: python -m app.sources

      - name: Partido de los congresistas
        # El dataset de la Cámara no lo trae: sin este paso, quien entra por
        # primera vez se queda como "Unknown" y fuera del filtro por partido.
        run: python -m app.legislators

      - name: Nuevas operaciones de directivos (SEC Form 4)
        run: python -m app.insiders

      - name: Refrescar cotizaciones
        # Sin esto el patrimonio de las fichas se muestra con precios cada vez
        # más viejos: en serverless las páginas sirven lo que hay en caché y no
        # llaman al proveedor.
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m app.prices

      - name: Histórico de cotizaciones, splits y dividendos
        # Por tandas (HISTORY_MAX_SYMBOLS por pasada): Yahoo limita por ráfaga
        # y el universo completo se renueva en pocas pasadas.
        run: python -m app.history
