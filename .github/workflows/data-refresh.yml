name: Refresco de datos

# En Vercel no hay proceso que sobreviva a la respuesta, así que el polling
# está apagado allí: sin esto, los datos se quedarían congelados en la fecha del
# último comando lanzado a mano desde un portátil.
on:
  schedule:
    # Cada seis horas. Las fuentes oficiales publican por lotes; bajar de aquí
    # sólo gasta ancho de banda, porque la latencia real la marca cuándo publica
    # la fuente, no cada cuánto preguntamos.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  # Dos pasadas a la vez sobre la misma base se pisarían al deduplicar.
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Nuevas operaciones declaradas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENABLE_POLLING: "0"
        run: python -m app.insiders

      - name: Refrescar cotizaciones
        # Sin esto el patrimonio de las fichas se muestra con precios cada vez
        # más viejos: en serverless las páginas sirven lo que hay en caché y no
        # llaman al proveedor.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ENABLE_POLLING: "0"
        run: python -m app.prices
